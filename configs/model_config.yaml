model:
  vocab_size: 8192
  d_model: 512
  n_heads: 8
  n_layers: 10
  d_ff: 2048
  max_seq_len: 512
  dropout: 0.1
  weight_tying: false

data:
  dataset_name: "roneneldan/TinyStories"
  dataset_config: null
  text_field: "text"
  batch_size: 8
  seq_len: 256
  buffer_size: 1000

training:
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 100
  eval_interval: 10
  save_interval: 50
  grad_clip: 1.0

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  checkpoints: "models/checkpoints"

system:
  device: "cpu"
  num_threads: 12
  seed: 42
